<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f7f8fa; color: #20242a; font-family: 'DM Sans', Arial, sans-serif; }
  .frame { position: absolute; inset: 40px; padding: 64px 72px; border: 1px solid #e5e8ec; border-radius: 22px; background: #fff; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .mark { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 16px; background: #20242a; color: #fff; font: 700 28px 'Manrope', sans-serif; letter-spacing: -.1em; }
  .label { color: #858d97; font: 500 18px 'DM Mono', monospace; letter-spacing: .12em; }
  .bubble { display: inline-block; margin-top: 44px; padding: 12px 20px; border-radius: 16px; background: #f1f3f6; color: #555d67; font-size: 22px; }
  h1 { margin: 22px 0 0; font: 700 76px/1.02 'Manrope', sans-serif; letter-spacing: -.045em; }
  .role { margin-top: 14px; color: #2456a4; font: 600 32px 'DM Sans', sans-serif; letter-spacing: -.01em; }
  .stack { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid #eceef1; color: #626a74; font: 500 20px 'DM Mono', monospace; }
  .stack b { color: #20242a; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top"><div class="mark"><svg viewBox="0 0 64 64" width="58" height="58"><path d="M22 46V22" fill="none" stroke="#fff" stroke-width="7"/><path d="M22 31.5C22 25 27 21.5 35.5 21.5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="41" cy="42.5" r="4.4" fill="#7fa6e6"/></svg></div><div class="label">ENGINEERING PORTFOLIO</div></div>
    <div class="bubble">Give me the short version.</div>
    <h1>Rodel Medina</h1>
    <div class="role">Senior Full-Stack Software Engineer · Since 2010</div>
    <div class="stack"><span>Rails · React · Next.js · Laravel · PostgreSQL</span><b>rodm.dev</b></div>
  </div>
</body>
</html>
